name: CI

on:
  push:
  pull_request:

# Least privilege: the jobs only need to read the code.
permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so every commit is scanned, not only the latest one.
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --config /repo/.gitleaks.toml

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: ESLint, Stylelint and Prettier
        run: npm run lint
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: PHP_CodeSniffer (Drupal and DrupalPractice standards)
        run: composer lint

  build:
    name: build
    runs-on: ubuntu-latest
    # Same database as the DDEV project. The credentials are throwaway test values
    # for a container that only lives during this job.
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: drupal
          MARIADB_USER: drupal
          MARIADB_PASSWORD: drupal
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      # Not a secret: the CI site is deleted when the job ends.
      DRUPAL_HASH_SALT: ci-only-hash-salt-not-a-secret
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: gd, pdo_mysql
          tools: composer:v2
          coverage: none
      - name: Validate composer.json and composer.lock
        run: composer validate --strict
      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Check dependencies for known vulnerabilities
        run: composer audit
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Check Node dependencies for known vulnerabilities
        # Fails on high/critical advisories; reviewed exceptions with an expiry
        # date live in scripts/ci/npm-audit-allowlist.json.
        run: node scripts/ci/npm-audit.mjs
      - name: Run JavaScript unit tests
        run: npm test
      - name: Build theme assets
        run: npm run build
      - name: Build Storybook
        run: npm run build-storybook
      - name: Check every story (renders without errors, axe)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:storybook
      - name: Install the site from config and smoke-test it
        env:
          DB_URL: mysql://drupal:drupal@127.0.0.1:3306/drupal
        run: bash scripts/ci/install-test.sh
      # Lighthouse and axe against the site installed above. Performance is
      # measured but not enforced here: shared CI machines and PHP's built-in
      # server make timing scores vary from run to run. docs/audit-results.md
      # holds the performance results measured on the DDEV site.
      # The site keeps running in the background for the browser-based steps below.
      - name: Start the site for browser tests
        env:
          # Let PHP's built-in server answer several requests at once.
          PHP_CLI_SERVER_WORKERS: '4'
        run: |
          vendor/bin/drush runserver 127.0.0.1:8888 > /tmp/runserver.log 2>&1 &
          for _ in $(seq 1 30); do curl --silent --output /dev/null http://127.0.0.1:8888/ && break; sleep 1; done
      - name: Audit accessibility, best practices and SEO (Lighthouse, axe)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          BASE_URL: http://127.0.0.1:8888
        run: npm run audit:site -- --skip-performance
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: End-to-end tests (Chromium, Firefox, WebKit, phone emulation)
        env:
          BASE_URL: http://127.0.0.1:8888
        run: npm run test:e2e
      - name: Upload test and audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            reports/
            docs/audit-results.md
          if-no-files-found: ignore
