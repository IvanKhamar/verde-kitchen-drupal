verde_leads.contact:
  path: '/contact'
  defaults:
    _controller: '\Drupal\verde_leads\Controller\ContactController::page'
    _title: 'Contact'
    _title_context: 'Contact form'
  requirements:
    # Open to everyone: it is the public contact form.
    _access: 'TRUE'

# Admin pages (Claro, because the paths start with /admin).
entity.verde_lead.collection:
  path: '/admin/content/contact-messages'
  defaults:
    _entity_list: verde_lead
    _title: 'Contact messages'
  requirements:
    _permission: 'view contact messages'

entity.verde_lead.canonical:
  path: '/admin/content/contact-messages/{verde_lead}'
  defaults:
    _controller: '\Drupal\verde_leads\Controller\LeadController::view'
    _title_callback: '\Drupal\verde_leads\Controller\LeadController::title'
  requirements:
    _entity_access: 'verde_lead.view'

verde_leads.retry:
  path: '/admin/content/contact-messages/{verde_lead}/retry'
  defaults:
    _controller: '\Drupal\verde_leads\Controller\LeadController::retry'
  requirements:
    _permission: 'retry contact messages'
    # The link carries a token, so another site cannot trigger a retry.
    _csrf_token: 'TRUE'
