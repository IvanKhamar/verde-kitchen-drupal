# A library is a named group of CSS and JS files. Drupal adds a library to a page
# only when something asks for it: the theme's .info.yml (every page), a template
# ({{ attach_library('verde/name') }}), a preprocess function or a render array.
#
# The files in dist/ are built by Webpack from src/ (npm run build); they are not
# committed. The "theme" CSS group loads after core and module CSS.

global:
  css:
    theme:
      dist/css/global.css: {}

# Attached only on full product and article pages, from their node templates.
product:
  css:
    theme:
      dist/css/product.css: {}

article:
  css:
    theme:
      dist/css/article.css: {}

# React catalog filter. Attached only by the catalog page template, so no other
# page downloads React. The bundle is already minified by Webpack.
catalog-filter:
  css:
    theme:
      dist/css/catalog-filter.css: {}
  js:
    dist/js/catalog-filter.js: { minified: true }
  dependencies:
    - core/drupal
    - core/once
    # React renders the same markup as these SDC components, so it needs their
    # CSS even when Twig does not render the component on the page. Drupal
    # names component libraries core/components.THEME--COMPONENT.
    - core/components.verde--button
    - core/components.verde--badge
    - core/components.verde--card
    - core/components.verde--teaser-grid
    - core/components.verde--shopping-list-button

# "Add to list" buttons and the header counter. Plain JavaScript (no React),
# on every page through verde.info.yml. Drupal.announce() speaks the changes.
shopping-list:
  js:
    dist/js/shopping-list.js: { minified: true }
  dependencies:
    - core/drupal
    - core/drupal.announce
    - core/once

# The shopping list page (React).
shopping-list-page:
  css:
    theme:
      dist/css/shopping-list-page.css: {}
  js:
    dist/js/shopping-list-page.js: { minified: true }
  dependencies:
    - core/drupal
    - core/drupal.announce
    - core/once
    - core/components.verde--button

# The contact form (module verde_leads); attached by verde_form_verde_leads_contact_alter().
contact:
  css:
    theme:
      dist/css/contact.css: {}
  dependencies:
    - core/components.verde--button
