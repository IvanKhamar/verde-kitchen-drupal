$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Hero
status: stable
description: A large banner with a heading, text, call to action and image. The "promo" variant is a smaller banner for a campaign.
props:
  type: object
  required:
    - heading
  properties:
    heading:
      type: string
      title: Heading
    text:
      type: string
      title: Text
    cta_label:
      type: string
      title: Call to action label
    cta_url:
      type: string
      title: Call to action URL
    variant:
      type: string
      title: Variant
      enum:
        - hero
        - promo
      default: hero
slots:
  image:
    title: Image
