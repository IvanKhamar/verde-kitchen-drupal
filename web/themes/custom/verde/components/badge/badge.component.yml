$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Badge
status: stable
description: A short label, for example a dietary tag such as "Vegan".
props:
  type: object
  required:
    - label
  properties:
    label:
      type: string
      title: Label
    variant:
      type: string
      title: Variant
      enum:
        - default
        - accent
      default: default
